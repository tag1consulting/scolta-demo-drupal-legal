langcode: en
status: true
dependencies:
  config:
    - search_api.server.scolta
  module:
    - node
    - search_api
id: complianceiq
name: ComplianceIQ
description: 'Compliance content search index'
read_only: false
field_settings:
  title:
    label: Title
    datasource_id: 'entity:node'
    property_path: title
    type: text
    boost: '5.0'
  body:
    label: Body
    datasource_id: 'entity:node'
    property_path: 'body.value'
    type: text
  type:
    label: 'Content type'
    datasource_id: 'entity:node'
    property_path: type
    type: string
  status:
    label: 'Published'
    datasource_id: 'entity:node'
    property_path: status
    type: boolean
datasource_settings:
  'entity:node':
    bundles:
      default: false
      selected:
        - regulation_section
        - guidance_article
        - enforcement_case
        - checklist
        - comparison
        - glossary_term
    languages:
      default: true
      selected: {  }
processor_settings:
  add_url: {  }
  entity_status:
    all_fields: false
  html_filter:
    all_fields: false
    tags:
      em: '1.0'
      strong: '1.0'
    title: false
    alt: true
    strips_tags: false
    fields:
      - body
  ignorecase:
    all_fields: true
    fields:
      - title
      - body
  tokenizer:
    all_fields: false
    fields:
      - title
      - body
    spaces: ''
    ignored: ''''
  stopwords:
    all_fields: false
    fields:
      - title
      - body
    stopwords: ''
    filepath: ''
tracker_settings:
  default:
    indexing_order: fifo
options:
  index_directly: true
  cron_limit: 50
server: scolta
