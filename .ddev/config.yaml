name: complianceiq
type: drupal
php_version: "8.3"
mariadb_version: "10.11"
webserver_type: nginx-fpm
docroot: web
database:
  type: mariadb
  version: "10.11"

hooks:
  post-start:
    - exec: composer install --no-interaction
    - exec: |
        # Remove stale pre-1.x module directory; composer now installs to scolta-drupal/.
        rm -rf /var/www/html/web/modules/contrib/scolta
    - exec: |
        if [ -f /var/www/html/db/dump.sql.gz ]; then
          zcat /var/www/html/db/dump.sql.gz | mysql -u root -proot db
          drush config:import --partial --source=../config/sync -y
          drush cache:rebuild
          drush php:script /var/www/html/scripts/fix-json-bodies.php
          drush php:script /var/www/html/scripts/generate-path-aliases.php
          drush php:script /var/www/html/scripts/setup-about-page.php
          mkdir -p /var/www/html/web/sites/default/private
          drush scolta:build
        fi
