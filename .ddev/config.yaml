name: complianceiq
type: drupal
php_version: "8.3"
mariadb_version: "10.11"
webserver_type: nginx-fpm
docroot: web
database:
  type: mariadb
  version: "10.11"

hooks:
  post-start:
    - exec: composer install --no-interaction
    # NOTE: tag1/scolta-drupal installs to web/modules/contrib/scolta (its
    # installer-name is "scolta", module machine name "scolta"). Do NOT rm that
    # directory here — it deletes the module composer just installed, which left
    # the site with no routes (/api/scolta 404), no scolta: drush namespace, and
    # no Pagefind index. web/modules/contrib/ is gitignored and composer-managed,
    # so there is no stale pre-1.x committed copy to clean.
    - exec: |
        if [ -f /var/www/html/db/dump.sql.gz ]; then
          zcat /var/www/html/db/dump.sql.gz | mysql -u root -proot db
          drush config:import --partial --source=../config/sync -y
          drush cache:rebuild
          drush php:script /var/www/html/scripts/fix-json-bodies.php
          drush php:script /var/www/html/scripts/generate-path-aliases.php
          drush php:script /var/www/html/scripts/setup-about-page.php
          mkdir -p /var/www/html/web/sites/default/private
          drush scolta:build
        fi
