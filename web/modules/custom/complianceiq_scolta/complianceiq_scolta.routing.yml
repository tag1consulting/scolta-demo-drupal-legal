complianceiq.search:
  path: '/search'
  defaults:
    _controller: '\Drupal\complianceiq_scolta\Controller\SearchController::search'
    _title: 'Search'
  requirements:
    _access: 'TRUE'


complianceiq.regulations:
  path: '/regulations/{framework}'
  defaults:
    _controller: '\Drupal\complianceiq_scolta\Controller\ListingController::regulation'
    _title: 'Regulations'
  requirements:
    _access: 'TRUE'

complianceiq.guidance:
  path: '/guidance'
  defaults:
    _controller: '\Drupal\complianceiq_scolta\Controller\ListingController::guidance'
    _title: 'Guidance'
    audience: ''
  requirements:
    _access: 'TRUE'

complianceiq.guidance.audience:
  path: '/guidance/{audience}'
  defaults:
    _controller: '\Drupal\complianceiq_scolta\Controller\ListingController::guidance'
    _title: 'Guidance'
  requirements:
    _access: 'TRUE'

complianceiq.enforcement:
